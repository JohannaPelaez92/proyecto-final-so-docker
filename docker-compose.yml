# Proyecto final de Sistemas Operativos
# Nginx (proxy inverso) + 3 backends Flask + monitoreo (exporter, cAdvisor, Prometheus, Grafana)

name: proyecto-final

services:

  # ---------- Backends: tres copias del mismo programa ----------
  app1:
    build: ./backend
    environment:
      SERVER_NAME: "server 1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - red-proyecto

  app2:
    build: ./backend
    environment:
      SERVER_NAME: "server 2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - red-proyecto

  app3:
    build: ./backend
    environment:
      SERVER_NAME: "server 3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - red-proyecto

  # ---------- Nginx: proxy inverso y balanceador ----------
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
    networks:
      - red-proyecto

  # ---------- Monitoreo ----------
  # Traduce el stub_status de Nginx (puerto interno 8088) al formato de Prometheus
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    command:
      - "--nginx.scrape-uri=http://nginx:8088/stub_status"
    depends_on:
      - nginx
    networks:
      - red-proyecto

  # Mide CPU, memoria, red y disco de cada contenedor
  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    command:
      - "--housekeeping_interval=5s"
      - "--docker_only=true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    networks:
      - red-proyecto

  # Visita cada fuente cada 5 s y guarda las series de tiempo
  prometheus:
    image: prom/prometheus:v3.13.5
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - nginx-exporter
    networks:
      - red-proyecto

  # Dibuja las métricas de Prometheus en dashboards
  grafana:
    image: grafana/grafana:12.4.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Solo para uso local: entra sin usuario y con rol Admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - red-proyecto

# ---------- Red propia: todos los contenedores se hablan por nombre aquí ----------
networks:
  red-proyecto:
    name: red-proyecto
    driver: bridge

# ---------- Volúmenes: los datos sobreviven a "docker compose down" ----------
volumes:
  prometheus-data:
  grafana-data:
